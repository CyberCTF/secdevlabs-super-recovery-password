# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Super Recovery Password (secDevLabs, by Globo.com) as an Isoloom spec: a React app and Go API
# whose password recovery is an Insecure Design flaw (enumerable users, guessable answers, no
# rate limit). Vendored unchanged from the app folder
# owasp-top10-2021-apps/a4/super-recovery-password of secDevLabs (build/app/app/,
# build/api/app/, the rest in app/), built by overlays of upstream's Dockerfiles, with its
# MariaDB machine. The page calls the API at http://localhost:3000, so the API keeps upstream's
# published port. `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-super-recovery-password

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.100.0/24, internet: false}

machines:
  db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /var/lib/mysql}
    ports:
      mariadb:
        port: 3306
    app:
      build: build/db
  api:
    networks: {lab: 11}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      api:
        port: 3000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/api

  app:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1536}
    depends_on: [api]
    ports:
      web:
        port: 40001
        protocol: http
        publish: true
    app:
      build: build/app
checks:
  - name: the page answers
    http: http://app:40001/
    wait: 300
  - name: the API answers
    http: http://api:3000/healthcheck
    wait: 120
  - name: the recovery flow tells known logins from unknown ones
    script: checks/userinfo.sh

message: |
  Super Recovery Password answers at {{ machines.app.ports.web.url }} and
  its API at {{ machines.api.ports.api.url }}. Look closely at "forgot my
  password": who can it tell you exists, and what does it take to reset a password?
